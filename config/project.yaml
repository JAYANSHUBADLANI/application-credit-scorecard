project:
  name: application-credit-scorecard
  random_seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  artifacts: artifacts
  figures: reports/figures

data:
  competition: home-credit-default-risk
  target: TARGET
  id_column: SK_ID_CURR
  required_files:
    - application_train.csv
    - application_test.csv
    - bureau.csv
    - bureau_balance.csv
    - previous_application.csv
    - installments_payments.csv
    - credit_card_balance.csv
    - POS_CASH_balance.csv
  chunk_size: 750000

features:
  exclude_columns:
    - TARGET
    - SK_ID_CURR
    - CODE_GENDER
  exclude_name_patterns:
    - ^SK_ID_
  minimum_non_null_fraction: 0.05
  maximum_unique_categories: 100

split:
  validation_fraction: 0.20
  test_fraction: 0.20

synthetic_acceptance:
  target_acceptance_rate: 0.65
  temperature: 0.12
  parcel_bad_odds_multiplier: 1.35
  parcel_bad_odds_sensitivity:
    - 1.00
    - 1.25
    - 1.35
    - 1.50
    - 2.00
  parcel_bands: 10

binning:
  maximum_prebins: 20
  maximum_categorical_bins: 8
  minimum_bin_fraction: 0.03
  smoothing: 0.5
  iv_minimum: 0.02
  iv_maximum: 0.50
  correlation_maximum: 0.70
  maximum_features: 20

model:
  regularization_c: 1.0
  maximum_iterations: 2000
  class_weight: null
  enforce_expected_coefficient_sign: true
  coefficient_positive_tolerance: 0.00000001
  base_score: 600
  base_odds_good_to_bad: 50
  points_to_double_odds: 20

validation:
  calibration_bins: 10
  bootstrap_samples: 200
  psi_bins: 10

economics:
  exposure_at_default: 100000
  ead_factor: 1.0
  loss_given_default: 0.55
  net_margin_rate: 0.08
  pre_default_bad_margin_rate: 0.02
  acquisition_cost: 1500
  operating_cost: 1000
  cutoff_grid_size: 101
  scenario_lgd:
    - 0.30
    - 0.45
    - 0.60
  scenario_margin_rate:
    - 0.05
    - 0.08
    - 0.12

decisioning:
  manual_review_width_points: 20
  maximum_bad_rate_scenarios:
    - 0.05
    - 0.08
    - 0.10
    - 0.12
