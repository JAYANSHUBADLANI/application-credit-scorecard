[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "application-credit-scorecard"
version = "0.1.0"
description = "Application credit scorecard and decisioning strategy for the Home Credit dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Jayanshu Badlani" }]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<7",
  "ruff>=0.5,<1",
]
kaggle = ["kaggle>=1.6,<2"]

[project.scripts]
credit-scorecard = "credit_scorecard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
